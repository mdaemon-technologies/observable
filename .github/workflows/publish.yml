# Stages a new npm version when a GitHub Release is published. npm trusted publishing (OIDC)
# authenticates the job, so no npm token is stored. A maintainer then approves the staged
# version with 2FA on npmjs.com (or `npm stage approve`) before it is public.
#
# The bundles are built and tested once in `build`, smoke-tested on the older runtimes in
# `smoke`, and that same dist/ is what `publish` stages.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 26.x   # Active LTS
        cache: 'npm'
    - name: Check the release tag matches package.json
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: test "v$(node -p "require('./package.json').version")" = "$TAG"
    - run: npm ci
    - run: npm run typecheck
    - run: npm run build
    - run: npm test
    - run: npm run test:dist   # exercises the built bundles
    - run: npm run test:smoke
    - run: npm run test:types   # consumer type-checks: TS 7 and TS 6, every module resolution
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error
        retention-days: 1

  smoke:
    # Vite and Vitest need Node 22.12+, but `engines` promises Node 18+. test/smoke.cjs uses
    # only Node built-ins, so it runs against the built bundles without `npm ci`.
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - run: node test/smoke.cjs

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # lets npm exchange a GitHub OIDC token for a short-lived publish token

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 26.x
        registry-url: https://registry.npmjs.org
    - run: npm install -g npm@latest   # trusted publishing and staged publishing need a recent npm
    - uses: actions/download-artifact@v8   # the exact dist/ that build and smoke tested
      with:
        name: dist
        path: dist
    - run: npm stage publish
